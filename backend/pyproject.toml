[project]
name = "chopthebil-backend"
version = "0.1.0"
description = "ChopTheBill FastAPI backend (mock in-memory DB, per openapi.yaml)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "email-validator>=2.0",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
